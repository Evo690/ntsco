<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recorded Classes - Portal Functions</title>
    <!-- Fonts from portal -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800&display=swap"
        rel="stylesheet">
    <!-- Link portal's styles.css directly -->
    <link rel="stylesheet" href="../styles.css">
    <!-- Standalone overrides for full screen layout and mobile behavior -->
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100dvh;
            width: 100vw;
            background: var(--bg);
        }

        .app-full {
            display: flex;
            height: 100%;
            width: 100%;
            overflow: hidden;
        }

        .sidebar {
            display: flex;
            flex-direction: column;
            height: 100%;
            background: var(--bg2);
            border-right: 1px solid var(--border);
            width: 270px;
            flex-shrink: 0;
            border-radius: 0;
            box-shadow: none;
        }

        .batch-list-scroll {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
        }

        .batch-item-btn {
            text-align: left;
            padding: 10px 12px;
            width: 100%;
            margin-bottom: 8px;
            cursor: pointer;
            background: var(--bg3);
            border: 1px solid var(--border);
            border-radius: var(--r);
            transition: all 0.2s ease;
        }

        .batch-item-btn:hover {
            border-color: var(--border2);
            background: var(--bg4);
        }

        .batch-item-btn.active {
            border-color: var(--accent);
            background: var(--bg3);
            box-shadow: 0 0 0 1px var(--accent);
        }

        .main {
            display: flex;
            flex-direction: column;
            height: 100%;
            overflow: hidden;
            flex: 1;
            background: var(--bg);
            border-radius: 0;
        }

        .topbar {
            padding: 0 24px;
            height: 56px;
            display: flex;
            align-items: center;
            border-bottom: 1px solid var(--border);
            background: var(--bg2);
            flex-shrink: 0;
        }

        .content {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
        }

        /* Classes Grid & Items */
        .classes-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(310px, 1fr));
            gap: 14px;
        }

        .class-card {
            background: var(--bg2);
            border: 1px solid var(--border);
            border-radius: var(--r);
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            transition: all 0.2s ease;
        }

        .class-card:hover {
            border-color: var(--border2);
            background: var(--bg3);
            transform: translateY(-1px);
        }

        .subject-pill {
            font-size: 11px;
            font-weight: 700;
            padding: 3px 9px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
            display: inline-flex;
            align-items: center;
            width: fit-content;
        }

        .sub-phy {
            background: rgba(59, 130, 246, 0.15);
            color: #3b82f6;
            border: 1px solid rgba(59, 130, 246, 0.3);
        }

        .sub-chem {
            background: rgba(16, 185, 129, 0.15);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.3);
        }

        .sub-math {
            background: rgba(245, 158, 11, 0.15);
            color: #f59e0b;
            border: 1px solid rgba(245, 158, 11, 0.3);
        }

        .sub-bio {
            background: rgba(236, 72, 153, 0.15);
            color: #ec4899;
            border: 1px solid rgba(236, 72, 153, 0.3);
        }

        .sub-other {
            background: rgba(139, 92, 246, 0.15);
            color: #8b5cf6;
            border: 1px solid rgba(139, 92, 246, 0.3);
        }

        .id-badge {
            font-family: monospace;
            font-size: 11px;
            background: var(--bg3);
            border: 1px solid var(--border);
            color: var(--text2);
            padding: 3px 8px;
            border-radius: 6px;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            gap: 5px;
            transition: all 0.15s;
        }

        .id-badge:hover {
            border-color: var(--accent);
            color: var(--accent);
            background: var(--bg4);
        }

        .filter-chip {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 500;
            border: 1px solid var(--border);
            background: var(--bg3);
            color: var(--text2);
            cursor: pointer;
            transition: all 0.15s;
        }

        .filter-chip:hover {
            border-color: var(--border2);
            color: var(--text);
        }

        .filter-chip.active {
            background: var(--accent);
            color: #fff;
            border-color: var(--accent);
        }

        /* Toast notification */
        .toast {
            position: fixed;
            bottom: 24px;
            right: 24px;
            background: var(--bg2);
            border: 1px solid var(--accent);
            color: var(--text);
            padding: 10px 18px;
            border-radius: 10px;
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.25);
            font-size: 13px;
            font-weight: 500;
            z-index: 1100;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.25s ease;
            pointer-events: none;
        }

        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }

        @media(max-width: 768px) {
            .sidebar {
                position: fixed;
                left: 0;
                top: 0;
                bottom: 0;
                z-index: 100;
                transform: translateX(-100%);
                transition: transform 0.25s;
                width: 260px;
            }

            .sidebar.open {
                transform: translateX(0);
            }

            .topbar {
                padding: 0 16px;
            }

            .content {
                padding: 16px;
            }

            .classes-grid {
                grid-template-columns: 1fr;
            }
        }
    </style>
    <!-- Supabase JS Library -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>
    <div class="app-full">
        <!-- Sidebar for Batch Search & List -->
        <aside class="sidebar" id="sidebar">
            <div class="sidebar-logo" style="border-bottom: 1px solid var(--border); padding-bottom: 16px;">
                <div class="logo-icon" style="background: rgba(139, 92, 246, 0.15); color: #8b5cf6;">CL</div>
                <div>
                    <div class="logo-text">Recorded Classes</div>
                    <div class="logo-sub">Portal Functions</div>
                </div>
            </div>
            <div style="padding: 14px 16px; border-bottom: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px;">
                <div class="topbar-search-wrap" style="width: 100%; margin: 0;">
                    <input type="text" id="batch-search" class="topbar-search" style="width: 100%;"
                        placeholder="Search batches..." oninput="filterBatches()">
                </div>
                <select id="year-selector" class="tt-select"
                    style="width: 100%; margin: 0; height: 36px; padding: 0 10px;" onchange="filterBatches()">
                    <option value="all">All Academic Years</option>
                </select>
            </div>
            <div id="batch-list-scroll" class="batch-list-scroll">
                <div id="batch-loading"
                    style="text-align: center; color: var(--text3); font-size: 13px; padding: 20px 0;">Loading batches...</div>
                <div id="batch-list" style="display: flex; flex-direction: column;"></div>
            </div>
        </aside>

        <!-- Main Content Area -->
        <div class="main">
            <div class="topbar">
                <button class="hamburger" id="hamburger" onclick="toggleSidebar()">
                    <svg width="20" height="20" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.8">
                        <path d="M3 6h14M3 10h14M3 14h14" />
                    </svg>
                </button>
                <div class="topbar-title" id="page-title" style="margin-left: 8px;">Previous Recorded Classes</div>
                <div style="flex: 1;"></div>
                <div style="display: flex; align-items: center; gap: 12px;">
                    <div class="sync-pill" id="sync-pill">Database</div>
                    <button class="theme-mode-btn" onclick="window.close()"
                        style="margin: 0; padding: 6px 12px; font-size: 12px;">Close Page</button>
                </div>
            </div>

            <div class="content">
                <div class="full-card">
                    <!-- Batch Header -->
                    <div class="card-header"
                        style="justify-content: space-between; border-bottom: 1px solid var(--border); padding-bottom: 12px; margin-bottom: 16px; flex-wrap: wrap; gap: 10px;">
                        <div>
                            <h2 class="card-title" id="selected-batch-name" style="font-size: 16px;">No Batch Selected</h2>
                            <div id="classes-meta-info" style="font-size: 12px; color: var(--text3); margin-top: 4px;">
                                Please select a batch from the sidebar
                            </div>
                        </div>
                        <div id="batch-filters-row" style="display: none; align-items: center; gap: 8px; flex-wrap: wrap;">
                            <button class="filter-chip active" onclick="filterBySubject('all', this)">All</button>
                            <button class="filter-chip" onclick="filterBySubject('Physics', this)">Physics</button>
                            <button class="filter-chip" onclick="filterBySubject('Chemistry', this)">Chemistry</button>
                            <button class="filter-chip" onclick="filterBySubject('Mathematics', this)">Math</button>
                            <button class="filter-chip" onclick="filterBySubject('Biology', this)">Biology</button>
                        </div>
                    </div>

                    <!-- Search Input within Batch -->
                    <div id="batch-search-wrap" style="display: none; margin-bottom: 16px;">
                        <div class="topbar-search-wrap" style="width: 100%; max-width: 380px; margin: 0;">
                            <input type="text" id="class-filter-search" class="topbar-search" style="width: 100%; height: 34px; font-size: 12px;"
                                placeholder="Filter by subject, date, or class ID..." oninput="filterClassesInBatch()">
                        </div>
                    </div>

                    <!-- Placeholder / Empty State -->
                    <div id="classes-placeholder" class="empty" style="padding: 60px 20px;">
                        Select a batch from the sidebar to view its recorded classes.
                    </div>

                    <!-- Classes Grid -->
                    <div id="classes-grid" class="classes-grid" style="display: none;"></div>
                </div>
            </div>
        </div>
    </div>

    <!-- Toast Component -->
    <div class="toast" id="toast">Notification</div>

    <!-- Mobile Overlay -->
    <div class="overlay" id="overlay" onclick="closeSidebar()"></div>

    <script src="classes.js"></script>
</body>

</html>
